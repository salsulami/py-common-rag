[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-common-lib"
version = "0.1.0"
description = "Reusable RAG pipeline components for retrieval, reasoning, and document parsing."
readme = "LICENSE"
requires-python = ">=3.10"
authors = [
  { name = "RAG Common Library" }
]
dependencies = []

[project.optional-dependencies]
llm = ["openai"]
pdf = ["pypdf"]
pptx = ["python-pptx"]
docx = ["python-docx"]
vision = ["pymupdf"]
all = ["openai", "pypdf", "python-pptx", "python-docx", "pymupdf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_common = ["py.typed"]
